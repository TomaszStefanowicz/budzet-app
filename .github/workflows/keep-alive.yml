name: Ping podtrzymujący Supabase

# SPEC.md V.49: plan darmowy Supabase pauzuje projekt po ~tygodniu niskiej
# aktywności. Ten workflow codziennie wykonuje trywialne zapytanie SELECT
# do obu instancji chmurowych (demo i produkcja), zeby zadna nie zostala
# spauzowana. Zero zmian w kodzie aplikacji - dziala niezaleznie od tego,
# na jakim commicie stoi galaz demo.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping instancji demo
        run: |
          curl -sf -X GET "${SUPABASE_URL}/rest/v1/imports?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_DEMO_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_DEMO_SECRET_KEY }}

      - name: Ping instancji produkcja
        run: |
          curl -sf -X GET "${SUPABASE_URL}/rest/v1/imports?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -o /dev/null
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_PROD_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PROD_SECRET_KEY }}
